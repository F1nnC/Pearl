<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Pearl App</title>
</head>
<body>
    <div class="sidebar">
        <h1>Pearl</h1>
        <ul>
            <li><a href="#">Chat</a></li>
            <li><a href="#">Account</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </div>

    <!-- Topbar for mobile: hamburger + brand -->
    <header class="topbar" role="banner">
        <button class="hamburger" aria-label="Open menu" aria-expanded="false">
            <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <rect width="22" height="2" rx="1" fill="currentColor" />
                <rect y="7" width="22" height="2" rx="1" fill="currentColor" />
                <rect y="14" width="22" height="2" rx="1" fill="currentColor" />
            </svg>
        </button>
        <div class="brand">Pearl</div>
    </header>

    <!-- Mobile full-screen menu (appears when hamburger is toggled) -->
    <div class="mobile-menu" role="dialog" aria-modal="true" hidden>
        <nav class="mobile-nav">
            <button class="mobile-close" aria-label="Close menu">✕</button>
            <ul>
                <li><a href="#">Chat</a></li>
                <li><a href="#">Account</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </div>

    <script>
        // Toggle mobile menu
        (function () {
            const hamburger = document.querySelector('.hamburger');
            const mobileMenu = document.querySelector('.mobile-menu');
            const mobileClose = document.querySelector('.mobile-close');

            function openMenu() {
                mobileMenu.hidden = false;
                mobileMenu.classList.add('open');
                hamburger.setAttribute('aria-expanded', 'true');
                hamburger.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeMenu() {
                mobileMenu.classList.remove('open');
                mobileMenu.hidden = true;
                hamburger.setAttribute('aria-expanded', 'false');
                hamburger.classList.remove('open');
                document.body.style.overflow = '';
            }

            hamburger.addEventListener('click', function () {
                const expanded = hamburger.getAttribute('aria-expanded') === 'true';
                if (expanded) closeMenu(); else openMenu();
            });

            mobileClose.addEventListener('click', closeMenu);

            // Close when clicking outside nav area
            mobileMenu.addEventListener('click', (e) => { if (e.target === mobileMenu) closeMenu(); });
        })();
    </script>

</body>
</html>
